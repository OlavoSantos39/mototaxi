name: Build MotoDemerval APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar dependencias
        run: npm install

      - name: Criar projeto Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Adicionar permissao de localizacao
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permissoes = '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />'

          if "ACCESS_FINE_LOCATION" not in s:
              s = s.replace(
                  "<application",
                  permissoes + "\n    <application",
                  1
              )

          p.write_text(s)
          PY

      - name: Dar permissao ao Gradle
        run: chmod +x android/gradlew

      - name: Gerar APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: MotoDemerval-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
